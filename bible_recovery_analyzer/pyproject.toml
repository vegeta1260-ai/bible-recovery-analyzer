[project]
name = "bible-recovery-analyzer"
version = "0.1.0"
description = "Bible Recovery Version & Original Language Analyzer prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.30",
  "pydantic-settings>=2.3.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
