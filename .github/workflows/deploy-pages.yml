name: Build and Deploy to bible.weiqi.kids

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Unit tests
        run: npm test
        working-directory: web

      - name: Recovery coverage (實打 LSM 驗 66 卷中英恢復本可取，失敗則不部署)
        run: npm run check:recovery
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          # Cloudflare Web Analytics beacon token（公開值，設為 repo variable 即生效；未設則不注入）
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}

      - name: Build smoke test (dist/ 產物檢查，失敗則不部署)
        run: bash scripts/smoke-test-build.sh
        working-directory: web

      - name: Deploy to host via rsync over SSH
        # 把 build 產物同步進主機 /opt/static-sites/bible/，由 NPM(nginx) 容器掛載服務。
        # SSH_PRIVATE_KEY 為 repo secret（對應主機 github 帳號 authorized_keys 的公鑰）；
        # 走 env 傳入（不內插進 shell script，避免落進命令列/日誌）。
        # accept-new：首連自動記錄主機鑰，之後換鑰即失敗（取代不驗鑰的 =no）。
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_KEY" > deploy_key && chmod 600 deploy_key
          trap 'rm -f deploy_key' EXIT
          rsync -avz --delete --delay-updates dist/ \
            -e "ssh -i deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new" \
            github@172.235.205.148:/opt/static-sites/bible/
        working-directory: web

      - name: Post-deploy smoke test (實站驗證，含佔位頁回歸 gate)
        run: bash scripts/smoke-test-deployed.sh https://bible.weiqi.kids
        working-directory: web
